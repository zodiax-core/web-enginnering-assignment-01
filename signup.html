<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal - Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">


<!-- Navbar -->
<nav class="bg-blue-600">

    <div class="max-w-6xl mx-auto px-4">

        <div class="flex justify-between items-center h-16">

            <a href="index.html" class="text-white text-xl font-bold">
                Student Portal
            </a>

            <div class="hidden md:flex space-x-6">

                <a href="index.html" class="text-white">Home</a>
                <a href="about.html" class="text-white">About</a>
                <a href="contact.html" class="text-white">Contact</a>
                <a href="signup.html" class="text-white">Sign Up</a>
                <a href="signin.html" class="text-white">Sign In</a>

            </div>

            <button id="menuBtn" class="md:hidden text-white text-2xl">
                ☰
            </button>

        </div>

        <div id="mobileMenu" class="hidden md:hidden pb-4">

            <a href="index.html" class="block text-white py-2">Home</a>
            <a href="about.html" class="block text-white py-2">About</a>
            <a href="contact.html" class="block text-white py-2">Contact</a>
            <a href="signup.html" class="block text-white py-2">Sign Up</a>
            <a href="signin.html" class="block text-white py-2">Sign In</a>

        </div>

    </div>

</nav>


<!-- Sign Up -->
<main class="min-h-screen flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-md bg-white rounded-lg shadow p-7">

        <!-- Component 1: Icon -->
        <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full
                    flex items-center justify-center mx-auto text-2xl font-bold">
            S
        </div>


        <h1 class="text-3xl font-bold text-center mt-5">
            Create Account
        </h1>

        <p class="text-center text-gray-600 mt-2">
            Fill in the information below.
        </p>


        <form id="signupForm" class="mt-7 space-y-5">


            <!-- Component 2: Input -->
            <div>

                <label for="name" class="block mb-2 font-medium">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    required
                    minlength="2"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500"
                    placeholder="Enter your name"
                >

            </div>


            <!-- Component 3: Email -->
            <div>

                <label for="email" class="block mb-2 font-medium">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500"
                    placeholder="Enter your email"
                >

            </div>


            <!-- Component 4: Password -->
            <div>

                <label for="password" class="block mb-2 font-medium">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    minlength="8"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500"
                    placeholder="Minimum 8 characters"
                >

            </div>


            <!-- Component 5: Select -->
            <div>

                <label for="role" class="block mb-2 font-medium">
                    Account Type
                </label>

                <select
                    id="role"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3"
                >

                    <option value="">
                        Select account type
                    </option>

                    <option>
                        Student
                    </option>

                    <option>
                        Teacher
                    </option>

                </select>

            </div>


            <!-- Component 6: Checkbox -->
            <div class="flex items-start">

                <input
                    id="terms"
                    type="checkbox"
                    required
                    class="w-4 h-4 mt-1 text-blue-600 rounded"
                >

                <label for="terms" class="ml-2 text-sm text-gray-600">
                    I agree to the terms and conditions.
                </label>

            </div>


            <!-- Component 7: Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg
                       hover:bg-blue-700 font-medium"
            >
                Sign Up
            </button>


            <p
                id="success"
                class="hidden text-center text-green-600 text-sm"
            >
                Your information has been validated successfully.
            </p>


            <p class="text-center text-sm text-gray-600">

                Already have an account?

                <a
                    href="signin.html"
                    class="text-blue-600 font-semibold hover:underline"
                >
                    Sign in.
                </a>

            </p>

        </form>

    </div>

</main>


<script>

document.getElementById("menuBtn").addEventListener("click", function () {

    document.getElementById("mobileMenu").classList.toggle("hidden");

});


document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("success").classList.remove("hidden");

});

</script>

</body>
</html>
